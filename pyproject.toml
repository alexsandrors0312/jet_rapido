[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-rapido"
version = "0.1.0"
description = "Importação e planejamento de entregas last-mile"
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
jet-rapido = "jet_rapido.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
