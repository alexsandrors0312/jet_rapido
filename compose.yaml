services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jet_rapido
      POSTGRES_USER: jet_rapido
      POSTGRES_PASSWORD: jet_rapido
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jet_rapido -d jet_rapido"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - jet_rapido_postgres:/var/lib/postgresql/data

volumes:
  jet_rapido_postgres:
