name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: jet_rapido_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jet_rapido_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JET_RAPIDO_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jet_rapido_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
