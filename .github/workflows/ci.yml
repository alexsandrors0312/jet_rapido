name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: jet_rapido_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jet_rapido_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JET_RAPIDO_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jet_rapido_test
      JET_RAPIDO_TEST_OSRM_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Preparar OSRM real com perfil pedestre e rede sintética
        run: |
          mkdir -p "$RUNNER_TEMP/osrm"
          cp tests/fixtures/pedestrian.osm "$RUNNER_TEMP/osrm/map.osm"
          docker run --rm -v "$RUNNER_TEMP/osrm:/data" osrm/osrm-backend:v5.27.1 osrm-extract -p /opt/foot.lua /data/map.osm
          docker run --rm -v "$RUNNER_TEMP/osrm:/data" osrm/osrm-backend:v5.27.1 osrm-contract /data/map.osrm
          docker run -d --name jet-osrm-ci -p 127.0.0.1:5000:5000 -v "$RUNNER_TEMP/osrm:/data:ro" osrm/osrm-backend:v5.27.1 osrm-routed --algorithm ch /data/map.osrm
          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://localhost:5000/nearest/v1/foot/0.0012,0.001' >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs jet-osrm-ci
          exit 1
      - run: python -m unittest discover -s tests -v
