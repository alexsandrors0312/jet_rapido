# Preparar data/osrm/map.osrm com scripts/prepare_osrm.ps1 antes de iniciar.
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "ch", "--max-table-size", "100", "/data/map.osrm"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data/osrm:/data:ro
